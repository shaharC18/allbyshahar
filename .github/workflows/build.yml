name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore packages
        run: dotnet restore AllByShahar.sln

      - name: Build
        run: dotnet build AllByShahar.sln --configuration Release --no-restore

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: build docker image
        run: docker build -t allbyshahar:test .

  publish:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: docker build -t ghcr.io/shaharc18/allbyshahar:latest -t ghcr.io/shaharc18/allbyshahar:${{ github.sha }} .

      - name: Push the image
        run: docker push --all-tags ghcr.io/shaharc18/allbyshahar
