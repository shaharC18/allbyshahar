name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore packages
        run: dotnet restore AllByShahar.sln

      - name: Build
        run: dotnet build AllByShahar.sln --configuration Release --no-restore

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: build docker image
        run: docker build -t allbyshahar:test .

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Create the .env file
        run: echo "SA_PASSWORD=Ci_Test_Pass_123!" > .env

      - name: Start the site and the database
        run: docker compose up -d --build --wait

      - name: Check that the site answers
        run: curl --retry 20 --retry-delay 5 --retry-all-errors -fsS -o /dev/null http://localhost:5050/

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  publish:
    needs: [docker, smoke-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: docker build -t ghcr.io/shaharc18/allbyshahar:latest -t ghcr.io/shaharc18/allbyshahar:${{ github.sha }} .

      - name: Push the image
        run: docker push --all-tags ghcr.io/shaharc18/allbyshahar
